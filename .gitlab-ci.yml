# .gitlab-ci.yml
# Runs pre-commit hooks and pattern tests on merge request.

stages:
  - lint
  - test

pre-commit:
  stage: lint
  image: python:3.11
  before_script:
    - pip install --no-cache-dir pre-commit
  script:
    - pre-commit run --all-files --show-diff-on-failure
  cache:
    key: pre-commit-${CI_JOB_IMAGE}
    paths:
      - ${PRE_COMMIT_HOME}
  variables:
    # Cache the hook environments between runs so jobs are fast after the first one
    PRE_COMMIT_HOME: ${CI_PROJECT_DIR}/.cache/pre-commit
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

tests:
  stage: test
  image: python:3.11
  script:
    - |
      echo "🧪 Running tests for all design patterns..."

      total_tests=0
      failed_patterns=""

      # Check each directory for tests
      for dir in */*/; do
        if [ -d "${dir}tests" ]; then
          pattern_name=${dir%/}
          echo "🔍 Testing $pattern_name pattern..."

          # Run all test modules in pattern_name/tests/
          for test_file in ${dir}tests/test_*.py; do
            if [ -f "$test_file" ]; then
              # Convert path to module: pattern/tests/test_file.py -> pattern.tests.test_file
              module=$(echo "$test_file" | sed 's|/|.|g' | sed 's|\.py$||')

              output=$(python -m "$module" -v 2>&1)
              exit_code=$?

              if [ $exit_code -eq 0 ]; then
                test_count=$(echo "$output" | grep -o "Ran [0-9]* test" | grep -o "[0-9]*" || echo "1")
                echo "   ✅ $test_count tests passed ($module)"
                total_tests=$((total_tests + test_count))
              else
                echo "   ❌ Tests failed ($module)"
                echo "$output" | grep -E "(FAIL|ERROR|Traceback|ModuleNotFoundError|ImportError|AssertionError)" | sed 's/^/      /'
                echo "   --- Full output ---"
                echo "$output" | sed 's/^/      /'
                failed_patterns="$failed_patterns $pattern_name"
              fi
            fi
          done
        fi
      done

      echo ""
      echo "📊 Total: $total_tests tests"

      if [ -n "$failed_patterns" ]; then
        echo "❌ Failed:$failed_patterns"
        exit 1
      else
        echo "✅ All tests passed!"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
